# pre-commit.ci is installed on this repository. This configuration keeps it to
# read-only checks: it may report, but it never rewrites a pull request branch.

ci:
  autofix_prs: false
  autoupdate_schedule: quarterly
  submodules: false

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-yaml
      - id: detect-private-key
